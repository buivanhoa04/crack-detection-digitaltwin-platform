# ============================================================
# Digital Twin - Web System
# Bản sao số phục vụ giám sát và đánh giá tự động
# sức khỏe công trình giao thông
# ============================================================
# Khởi chạy: docker compose up -d
# Dừng:      docker compose down
# Xem logs:  docker compose logs -f
# ============================================================

services:
  # ── Nginx Reverse Proxy ──────────────────────────────
  # Entry point duy nhất: tất cả request đi qua port 80/443
  nginx:
    image: nginx:1.25-alpine
    container_name: dt_nginx
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - deploy_net
    restart: unless-stopped

  # ── Central Backend (FastAPI) ────────────────────────
  # Proxy bảo mật giữa Frontend và các AI containers
  backend:
    image: buihoa04/web_backend:latest
    container_name: dt_backend
    environment:
      - APP_NAME=${APP_NAME:-Digital Twin - Central API}
      - DEBUG=${DEBUG:-false}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost,http://127.0.0.1}
      - CRACK_API_URL=${CRACK_API_URL:-http://host.docker.internal:8000}
      - CRACK_API_TOKEN=${CRACK_API_TOKEN:?CRACK_API_TOKEN is required}
      - TWIN_API_URL=${TWIN_API_URL:-http://digital_twin_master:8090}
      - TWIN_API_TOKEN=${CRACK_API_TOKEN}
      - RAGFLOW_API_URL=${RAGFLOW_API_URL:-http://host.docker.internal:8088}
      - RAGFLOW_API_TOKEN=${RAGFLOW_API_TOKEN:?RAGFLOW_API_TOKEN is required}
      - MONGODB_URL=${MONGODB_URL:-mongodb://host.docker.internal:27017}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://host.docker.internal:9000}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://host.docker.internal:9000}
      - RAGFLOW_BASE_URL=${RAGFLOW_BASE_URL:-http://host.docker.internal:8088/api/v1/chats_openai/default}
      - REDIS_URL=redis://redis-cache:6379/0
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@digitaltwin.vn}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - LOCAL_SOURCES_DIR=${LOCAL_SOURCES_DIR:-/data/file/sources}
    volumes:
      - ${HOST_SOURCES_DIR:-./backend/uploads}:/data/file/sources
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deploy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health/ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend (Next.js) ──────────────────────────────
  frontend:
    image: buihoa04/web_frontend:latest
    container_name: dt_frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - deploy_net
    restart: unless-stopped

  # ── Redis Cache ─────────────────────────────────────
  # Cache kết quả phân tích đã hoàn thành (giảm tải GPU)
  redis-cache:
    image: redis:7-alpine
    container_name: dt_redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_cache_data:/data
    networks:
      - deploy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  deploy_net:
    external: true

volumes:
  redis_cache_data:
    driver: local

# Ultralytics YOLO SOTA with CBAM Attention for OBB Task
# Architecture: YOLOv11/YOLO26 Base + CBAM in Backbone & Neck + OBB Output Head

# Hardcode scale m (depth=0.50, width=1.00, max_channels=512) để tránh việc Ultralytics nhận diện sai scale n từ tên file
nc: 3
depth_multiple: 0.50
width_multiple: 1.00
max_channels: 512 

# YOLO_SOTA backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 (P3 Output)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 (P4 Output)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 (P5 Output)
  - [-1, 1, CBAM, [1024]] # 11: CBAM Attention Focus on Global Context

# YOLO_SOTA head with BiFPN-like Neck Attention and OBB Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]] # 13: cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 14
  - [-1, 1, CBAM, [512]] # 15: Attention Background Suppression on P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 4], 1, Concat, [1]] # 17: cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 18 (P3/8-small)
  - [-1, 1, CBAM, [256]] # 19: Attention Edge Enhancement on P3

  - [-1, 1, Conv, [256, 3, 2]] # 20
  - [[-1, 15], 1, Concat, [1]] # 21: cat head P4
  - [-1, 2, C3k2, [512, False]] # 22 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 23
  - [[-1, 11], 1, Concat, [1]] # 24: cat head P5
  - [-1, 2, C3k2, [1024, True]] # 25 (P5/32-large)

  # [MỚI] Tầng đầu ra OBB (Oriented Bounding Box Head) thay thế cho Detect (HBB)
  - [[19, 22, 25], 1, OBB, [nc, 1]] # 26: OBB Head(P3_CBAM, P4_C3k2, P5_C3k2)
# Ultralytics YOLO SOTA with CBAM Attention for Bridge Defect Instance Segmentation Task
# Architecture: YOLOv11/YOLO26 Base + CBAM Attention in Backbone & Neck + Polygon Segment Output Head
# Classes: 7 Pure Bridge Structural Defect Classes

nc: 7
depth_multiple: 0.50
width_multiple: 1.00
max_channels: 512

# YOLO_SOTA backbone with CBAM Attention
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 (P3 Output)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 (P4 Output)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 (P5 Output)
  - [-1, 1, CBAM, [1024]] # 11: CBAM Attention Focus on Global Defect Context

# YOLO_SOTA head with BiFPN-like Neck Attention and Segment Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]] # 13: cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 14
  - [-1, 1, CBAM, [512]] # 15: Attention Background Suppression on P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 4], 1, Concat, [1]] # 17: cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 18 (P3/8-small)
  - [-1, 1, CBAM, [256]] # 19: Attention Edge Enhancement on P3 (Vết nứt & viền Polygon mảnh)

  - [-1, 1, Conv, [256, 3, 2]] # 20
  - [[-1, 15], 1, Concat, [1]] # 21: cat head P4
  - [-1, 2, C3k2, [512, False]] # 22 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 23
  - [[-1, 11], 1, Concat, [1]] # 24: cat head P5
  - [-1, 2, C3k2, [1024, True]] # 25 (P5/32-large)

  # [SOTA] Tầng đầu ra Instance Segmentation Head (nhận diện Polygon đa điểm cho 7 Class)
  - [[19, 22, 25], 1, Segment, [nc, 32, 256]] # 26: Segment Head(P3_CBAM, P4_C3k2, P5_C3k2)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────
    # Use $uri instead of $request so media/WebSocket query tokens never enter logs.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;

    # ── Gzip Compression ────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ── Rate Limiting ────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
    # Folder uploads are split into small sequential multipart requests.
    # This still protects the service while allowing large production jobs.
    limit_req_zone $binary_remote_addr zone=upload:10m rate=600r/m;
    limit_req_status 429;

    # ── Include server configs ───────────────────────
    include /etc/nginx/conf.d/*.conf;
}

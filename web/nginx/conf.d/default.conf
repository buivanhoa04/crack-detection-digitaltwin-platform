# ============================================================
# Digital Twin - Nginx Server Configuration
# Routes traffic between Frontend and Backend API
# ============================================================

# ── Upstream definitions ─────────────────────────────────
upstream frontend {
    server dt_frontend:3000;
}

upstream backend {
    server dt_backend:8080;
}

server {
    listen 80;
    server_name roadtwinai.online www.roadtwinai.online;

    # ── Security Headers ─────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # ── Gzip Compression ─────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/wasm
        model/gltf-binary
        model/gltf+json
        application/x-mpegURL
        video/MP2T;

    # ── API Routes → Backend ─────────────────────────────
    # All /api/* requests proxy to FastAPI backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range streaming support for video & 3D assets
        proxy_force_ranges on;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Large file upload support (video/images)
        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── Upload-specific rate limiting ────────────────────
    location /api/crack/detect {
        limit_req zone=upload burst=100 nodelay;
        add_header Retry-After 2 always;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/chatbot/upload {
        limit_req zone=upload burst=5 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # ── WebSocket Routes ─────────────────────────────────
    # WebSocket connections for real-time crack detection
    location /api/crack/ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SSE (Server-Sent Events) for chat streaming ──────
    location /api/chatbot/chat {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 180s;
        client_max_body_size 10M;
    }

    # ── Frontend Routes → Next.js ────────────────────────
    # All other requests go to the Next.js frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Next.js HMR WebSocket (dev only) ─────────────────
    location /_next/webpack-hmr {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Static assets caching ────────────────────────────
    location /_next/static {
        proxy_pass http://frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # ── Favicon ──────────────────────────────────────────
    location /favicon.ico {
        proxy_pass http://frontend;
        access_log off;
    }

    # ── Error pages ──────────────────────────────────────
    error_page 502 /502.html;
    location = /502.html {
        default_type text/html;
        return 502 '<!DOCTYPE html><html><head><title>Đang khởi động...</title><style>body{background:#0f172a;color:#e2e8f0;font-family:Inter,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}div{text-align:center;}h1{font-size:1.5rem;margin-bottom:0.5rem;}p{color:#64748b;font-size:0.875rem;}</style></head><body><div><h1>🔄 Hệ thống đang khởi động</h1><p>Vui lòng đợi trong giây lát rồi tải lại trang...</p></div></body></html>';
    }
}
